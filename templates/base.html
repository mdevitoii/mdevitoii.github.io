<!-- Michael DeVito II -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}/var/log/michael{% endblock %}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	
	<style>

		/* Base CSS */
		:root {
			--paper: #faf6f1;
			--panel: #f1ece3;
			--ink: #2e2a26;
			--ink-soft: #7a7168;
			--rule: #e4dcd0;
			--sage: #5b7065;
		}
		
		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }

		@media (prefers-reduce-motion: reduce) {
			html { scroll-behavior: auto; }
			* { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}

		body {
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: 'Inter', sans-serif;
			font-size: 16px;
			line-height: 1.65;
		}

		a {
			color: var(--ink);
			text-decoration: underline;
			text-decoration-color: var(--sage);
			text-underline-offset: 3px;
		}
		a:hover {
			text-decoration-color: var(--ink);
		}

		.wrap {
			max-width: 640px;
			margin: 0 auto;
			padding: 72px 24px 96px;
		}

		/* Header CSS */
		
		.prompt {
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.85rem;
			color: var(--sage); margin: 0 0 14px;
		}
		.prompt .path {
			color: var(--ink-soft);
		}
		.cursor {
			display: inline-block;
			width: 7px;
			height: 0.95em;
			background: var(--sage);
			margin-left: 5px;
			vertical-align: text-bottom;
			animation: blink 1.1s steps(1) infinite;
		}

		@keyframes blink { %50 { opacity: 0;} }
		@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
		
		.terminal {
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.84rem;
			line-height: 1.9;
			background: var(--panel);
			border: 1px solid var(--rule);
			border-radius: 4px;
			padding: 18px 20px;
			margin: 26px 0 32px;
		}

		.terminal .line { color: var(--sage); }
		.terminal .line .path { color: var(--ink-soft); }
		.terminal .listing { margin: 4px 0 10px; padding-left: 2px; }
		.terminal .listing a { display: block; color: var(--ink); text-decoration: none; }
		.terminal .listing a:hover { color: var(--sage); }
		.terminal .listing .perm { color: var(--ink-soft); margin-right: 12px; }
		.terminal .out { 
			color: var(--ink-soft);
			font-family: 'Inter', sans-serif;
			font-size: 0.98rem;
			margin: 8px 0 0;
			max-width: 54ch;
		}

		h1 {
			font-family: 'Fraunces', serif;
			font-weight: 500;
			font-size: 2.6rem;
			margin: 0 0 10px;
		}
		.role {
			font-family: 'Fraunces', serif;
			font-style: italic;
			font-size: 1.15rem;
			color: var(--sage);
			margin: 0 0 22px;
		}
		.links {
			display: flex;
			flex-direction: column;
			gap: 4px;
			font-size: 0.95rem;
		}

		/* Section CSS */

	</style>
